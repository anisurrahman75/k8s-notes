# Backend Applications for Gateway API Lab
# These are simple HTTP services that will be used as routing targets

---
# App Version 1
apiVersion: v1
kind: Namespace
metadata:
  name: b
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-v1
  namespace: b
spec:
  replicas: 1
  selector:
    matchLabels:
      app: myapp
      version: v1
  template:
    metadata:
      labels:
        app: myapp
        version: v1
    spec:
      containers:
        - name: app
          image: hashicorp/http-echo
          args:
            - "-text=Hello from App v2 namespace b"
            - "-listen=:8080"
          ports:
            - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: app-v1
  namespace: b
spec:
  selector:
    app: myapp
    version: v1
  ports:
    - port: 80
      targetPort: 8080
---