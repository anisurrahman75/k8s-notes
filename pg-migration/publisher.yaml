apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: publisher-pvc
  namespace: demo
spec:
  storageClassName: topolvm-provisioner-thin
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 60Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-publisher
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-publisher
  template:
    metadata:
      labels:
        app: pg-publisher
    spec:
      containers:
        - name: postgres
          image: postgres:15
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_DB
              value: testdb
          args:
            - "-c"
            - "wal_level=logical"
            - "-c"
            - "max_replication_slots=10"
            - "-c"
            - "max_wal_senders=10"
            - "-c"
            - "listen_addresses=*"
          volumeMounts:
            - name: publisher-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: publisher-storage
          persistentVolumeClaim:
            claimName: publisher-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: pg-publisher
  namespace: demo
spec:
  selector:
    app: pg-publisher
  ports:
    - port: 5432
      targetPort: 5432