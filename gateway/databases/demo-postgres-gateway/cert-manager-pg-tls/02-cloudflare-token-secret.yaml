# Cloudflare API Token secret for DNS-01 challenge.
# Replace <YOUR_CLOUDFLARE_API_TOKEN> with your actual token.
# Token needs Zone:DNS:Edit + Zone:Zone:Read permissions.
# Already exists in cluster - apply only if recreating.
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "<YOUR_CLOUDFLARE_API_TOKEN>"
