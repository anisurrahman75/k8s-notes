# PgBouncer ConfigMap for Tenant A.
# Direct connection to PostgreSQL with connection pooling.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config-tenant-a
  namespace: port-routing
data:
  pgbouncer.ini: |
    [databases]
    appdb = host=postgres-tenant-a.port-routing.svc.cluster.local port=5432 dbname=appdb user=tenant-a password=change-me-tenant-a

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = any
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    server_lifetime = 3600
    server_idle_timeout = 600
    client_idle_timeout = 0
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60

  userlist.txt: |
    "tenant-a" "change-me-tenant-a"
    "pgbouncer" "pgbouncer"

---
# PgBouncer Deployment for Tenant A.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer-tenant-a
  namespace: port-routing
  labels:
    app.kubernetes.io/name: pgbouncer-tenant-a
    dbaas.infrasnow.com/tenant: tenant-a
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer-tenant-a
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer-tenant-a
        dbaas.infrasnow.com/tenant: tenant-a
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: 5432
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config-tenant-a

---
# PgBouncer Service for Tenant A.
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer-tenant-a
  namespace: port-routing
  labels:
    app.kubernetes.io/name: pgbouncer-tenant-a
    dbaas.infrasnow.com/tenant: tenant-a
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgbouncer-tenant-a
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer

