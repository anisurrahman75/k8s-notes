# Request Header Manipulation
# Add, set, or remove headers from requests

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: header-manipulation-route
  namespace: demo
spec:
  parentRefs:
  - name: my-gateway

  hostnames:
  - "headers.example.com"

  rules:
  - filters:
    # Add new headers to the request
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        - name: X-Custom-Header
          value: "my-custom-value"
        - name: X-Request-ID
          value: "12345"

        # Set/override existing headers
        set:
        - name: X-Forwarded-Proto
          value: "https"

        # Remove headers before sending to backend
        remove:
        - X-Internal-Debug
        - X-Sensitive-Data

    backendRefs:
    - name: app-v1
      port: 80

---
# Use Cases:

# 1. Add Authentication/Authorization info
# - Add: X-User-ID, X-User-Role headers
# - Backend can use these for RBAC

# 2. Add tracing/debugging info
# - Add: X-Request-ID, X-Correlation-ID
# - Helps with distributed tracing

# 3. Security headers
# - Set: X-Frame-Options, X-Content-Type-Options
# - Protect against common vulnerabilities

# 4. Remove sensitive headers
# - Remove headers that shouldn't reach backend
# - Clean up internal routing information

# 5. Protocol information
# - Add: X-Forwarded-For, X-Forwarded-Proto
# - Let backend know about original client

---
# Example: Add security and tracing headers
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: security-headers-route
  namespace: demo
spec:
  parentRefs:
  - name: my-gateway

  hostnames:
  - "secure-app.example.com"

  rules:
  - filters:
    - type: RequestHeaderModifier
      requestHeaderModifier:
        add:
        # Tracing
        - name: X-Trace-ID
          value: "trace-xyz"
        # Security context
        - name: X-Gateway
          value: "envoy-gateway"
        # Backend routing hint
        - name: X-API-Version
          value: "v1"

        remove:
        # Don't forward these to backend
        - Cookie
        - Authorization

    backendRefs:
    - name: app-v1
      port: 80

