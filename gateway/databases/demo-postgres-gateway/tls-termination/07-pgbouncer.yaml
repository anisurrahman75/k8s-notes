apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  namespace: demo-db
data:
  pgbouncer.ini: |
    [databases]
    appdb_1 = host=demo-postgres-1.demo-db.svc.cluster.local port=5432 dbname=appdb user=demo password=demo-password
    appdb_2 = host=demo-postgres-2.demo-db.svc.cluster.local port=5432 dbname=appdb user=demo password=demo-password

    [pgbouncer]
    listen_addr = 0.0.0.0
    listen_port = 5432
    auth_type = any
    pool_mode = transaction
    max_client_conn = 1000
    default_pool_size = 20
    min_pool_size = 5
    reserve_pool_size = 5
    reserve_pool_timeout = 3
    server_lifetime = 3600
    server_idle_timeout = 600
    client_idle_timeout = 0
    log_connections = 0
    log_disconnections = 0
    log_pooler_errors = 1
    stats_period = 60
    client_tls_sslmode = allow
    client_tls_cert_file = /etc/pgbouncer-tls/tls.crt
    client_tls_key_file = /etc/pgbouncer-tls/tls.key

  userlist.txt: |
    "pgbouncer" "md57ffa3197c33171c4020e3a16824a1e3d"
    "demo" "md575f923431a04c44196d04af18766037"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: demo-db
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
    spec:
      securityContext:
        fsGroup: 65534
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: pgbouncer
              containerPort: 5432
          volumeMounts:
            - name: config
              mountPath: /etc/pgbouncer
              readOnly: true
            - name: tls
              mountPath: /etc/pgbouncer-tls
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: pgbouncer
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
      volumes:
        - name: config
          configMap:
            name: pgbouncer-config
        - name: tls
          secret:
            secretName: pg-wildcard-tls
            defaultMode: 0600

---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: demo-db
  labels:
    app.kubernetes.io/name: pgbouncer
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pgbouncer
  ports:
    - name: pgbouncer
      port: 5432
      targetPort: pgbouncer
