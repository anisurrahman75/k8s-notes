# HTTP Redirects
# Redirect requests to different URLs or enforce HTTPS

---
# Example 1: HTTP to HTTPS Redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: demo
spec:
  parentRefs:
  - name: my-gateway
    sectionName: http  # Attach to HTTP listener

  hostnames:
  - "redirect.example.com"

  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301  # Permanent redirect

---
# Example 2: Domain Redirect (www to non-www)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: www-redirect
  namespace: demo
spec:
  parentRefs:
  - name: my-gateway

  hostnames:
  - "www.example.com"

  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        hostname: example.com
        statusCode: 301

---
# Example 3: Path Redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-redirect
  namespace: demo
spec:
  parentRefs:
  - name: my-gateway

  hostnames:
  - "example.com"

  rules:
  # Redirect /old-page to /new-page
  - matches:
    - path:
        type: Exact
        value: /old-page
    filters:
    - type: RequestRedirect
      requestRedirect:
        path:
          type: ReplaceFullPath
          replaceFullPath: /new-page
        statusCode: 301

---
# Example 4: Complete URL Redirect
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: full-redirect
  namespace: demo
spec:
  parentRefs:
  - name: my-gateway

  hostnames:
  - "old.example.com"

  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        hostname: new.example.com
        port: 443
        statusCode: 301

---
# Test:
# HTTP to HTTPS:
# curl -v -H "Host: redirect.example.com" http://$GATEWAY_HOST/
# Should return 301 with Location: https://redirect.example.com/
#
# Domain redirect:
# curl -v -H "Host: www.example.com" http://$GATEWAY_HOST/
# Should return 301 with Location: http://example.com/

# HTTP Status Codes:
# - 301: Permanent Redirect (browsers cache this)
# - 302: Temporary Redirect (default)
# - 307: Temporary Redirect (preserves HTTP method)
# - 308: Permanent Redirect (preserves HTTP method)

# Use Cases:
# 1. Force HTTPS for security
# 2. Domain migration (old-site.com -> new-site.com)
# 3. Remove/add www prefix
# 4. Deprecate old URLs
# 5. Maintenance mode (redirect to maintenance page)

