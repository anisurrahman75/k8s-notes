# Gateway Resource
# This is the entry point for traffic into the cluster

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: my-gateway
  namespace: demo
spec:
  # Reference to the GatewayClass
  # "eg" is the default GatewayClass created by Envoy Gateway installation
  gatewayClassName: eg

  # Listeners define how the Gateway should handle incoming traffic
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    # allowedRoutes defines which Routes can attach to this listener
    allowedRoutes:
      namespaces:
        from: Same  # Only Routes in the same namespace can attach

---
# You can check the Gateway status with:
# kubectl get gateway my-gateway -n demo
# kubectl describe gateway my-gateway -n demo

# The Gateway will be assigned an external IP/hostname
# This is the address you'll use to send traffic to your services

