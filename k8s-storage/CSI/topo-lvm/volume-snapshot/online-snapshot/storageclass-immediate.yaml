allowVolumeExpansion: true
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  annotations:
    meta.helm.sh/release-name: topolvm
    meta.helm.sh/release-namespace: topolvm-system
  labels:
    app.kubernetes.io/instance: topolvm
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/name: topolvm
    app.kubernetes.io/version: 0.38.0
    helm.sh/chart: topolvm-15.7.0
  name: topolvm-provisioner-thin-immediate
parameters:
  csi.storage.k8s.io/fstype: xfs
  topolvm.io/device-class: thin
provisioner: topolvm.io
reclaimPolicy: Delete
volumeBindingMode: Immediate