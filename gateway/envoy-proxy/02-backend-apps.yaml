        - "-listen=:8080"
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: foo-app
  namespace: demo
spec:
  selector:
    app: foo
  ports:
  - port: 80
    targetPort: 8080
---
