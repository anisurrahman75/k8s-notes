# PostgreSQL auth credentials.
apiVersion: v1
kind: Secret
metadata:
  name: demo-postgres-auth-1
  namespace: demo-db
type: Opaque
stringData:
  POSTGRES_USER: demo
  POSTGRES_PASSWORD: demo-password
  POSTGRES_DB: appdb

---
# Headless Service for StatefulSet DNS resolution.
apiVersion: v1
kind: Service
metadata:
  name: demo-postgres-headless-1
  namespace: demo-db
  labels:
    app.kubernetes.io/name: demo-postgres-1
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: demo-postgres-1
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
# ClusterIP Service for application access.
apiVersion: v1
kind: Service
metadata:
  name: demo-postgres-1
  namespace: demo-db
  labels:
    app.kubernetes.io/name: demo-postgres-1
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: demo-postgres-1
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres

---
# PostgreSQL StatefulSet with cert-manager TLS.
# TLS cert/key mounted from Secret "pg-wildcard-tls" created by cert-manager Certificate.
# fsGroup: 999 ensures PostgreSQL user can read the mounted key.
# Key file permissions set to 0600 via defaultMode.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: demo-postgres-1
  namespace: demo-db
  labels:
    app.kubernetes.io/name: demo-postgres-1
spec:
  serviceName: demo-postgres-headless-1
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: demo-postgres-1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: demo-postgres-1
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17
          imagePullPolicy: IfNotPresent
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: demo-postgres-auth-1
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
            - name: postgres-tls
              mountPath: /etc/postgres-tls
              readOnly: true
          readinessProbe:
            exec:
              command:
                - sh
                - -ec
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: postgres
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
      volumes:
        - name: postgres-tls
          secret:
            secretName: pg-wildcard-tls
            defaultMode: 0600
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi

---
# TLSRoute for SNI-based routing through Envoy Gateway.
# Routes TLS traffic for demo-pg-1.db.infrasnow.com to the PostgreSQL service.
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: TLSRoute
metadata:
  name: demo-postgres-1
  namespace: demo-db
spec:
  parentRefs:
    - name: postgres-gateway
      namespace: default
      sectionName: postgres-tls
  hostnames:
    - demo-pg-1.db.infrasnow.com
  rules:
    - backendRefs:
        - name: demo-postgres-1
          port: 5432
