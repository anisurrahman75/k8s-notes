# PVC provisioned from the VolumeSnapshot via the dataSource field.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: restored-pvc
  namespace: demo
spec:
  storageClassName: csi-gce-pd-ssd
  dataSource:
    name: source-pvc-snapshot
    kind: VolumeSnapshot
    apiGroup: snapshot.storage.k8s.io
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
