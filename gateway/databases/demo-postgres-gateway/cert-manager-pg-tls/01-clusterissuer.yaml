# ClusterIssuer for Let's Encrypt production using Cloudflare DNS-01 challenge.
# Requires: cloudflare-api-token Secret in cert-manager namespace.
# Already exists in cluster - apply only if recreating.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: obaydullahmhs@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-api-token
              key: api-token