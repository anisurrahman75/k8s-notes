# HTTPS Gateway with TLS Termination
# Secure your services with HTTPS

---
# First, create a TLS certificate secret:
#
# Method 1: Self-signed certificate (for testing)
# openssl req -x509 -newkey rsa:4096 -keyout tls.key -out tls.crt \
#   -days 365 -nodes -subj '/CN=secure.example.com'
# kubectl create secret tls example-tls --cert=tls.crt --key=tls.key -n demo
#
# Method 2: cert-manager (for production)
# Install cert-manager and use Certificate resources

---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: https-gateway
  namespace: demo
spec:
  gatewayClassName: eg

  listeners:
  # HTTPS listener on port 443
  - name: https
    protocol: HTTPS
    port: 443
    hostname: "secure.example.com"
    tls:
      mode: Terminate  # Terminate TLS at the Gateway
      certificateRefs:
      - name: example-tls  # Reference to the TLS secret

  # Optional: HTTP listener for redirect
  - name: http
    protocol: HTTP
    port: 80

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-route
  namespace: demo
spec:
  parentRefs:
  - name: https-gateway
    sectionName: https  # Attach to the HTTPS listener

  hostnames:
  - "secure.example.com"

  rules:
  - backendRefs:
    - name: app-v1
      port: 80

---
# Test:
# export GATEWAY_HOST=$(kubectl get gateway https-gateway -n demo -o jsonpath='{.status.addresses[0].value}')
# curl -k -H "Host: secure.example.com" https://$GATEWAY_HOST/
#
# Note: -k flag ignores certificate validation (only for self-signed certs)

# Key Points:
# 1. TLS Termination happens at the Gateway
# 2. Traffic between Gateway and backend pods is unencrypted (within cluster)
# 3. For end-to-end encryption, use TLS mode: Passthrough
# 4. Certificate is stored as a Kubernetes Secret
# 5. Can use cert-manager for automatic certificate management

